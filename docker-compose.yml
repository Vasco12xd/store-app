# docker-compose.yml
version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: store_app_db
    environment:
      POSTGRES_USER: storeapp
      POSTGRES_PASSWORD: storeapp123
      POSTGRES_DB: storeapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: